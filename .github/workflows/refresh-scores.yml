name: Refresh NFL scores

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-nfl-scores
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Refresh live scores from ESPN
        run: python3 tools/refresh_scores.py

      - name: Publish updated scores
        run: |
          if git diff --quiet -- lines.json; then
            echo "No score changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lines.json
          git commit -m "Refresh NFL scores"
          git push
